<!doctype html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="BN akcija — dnevne i sedmične ponude u marketima, mesarama i apotekama.">
  <title>BN akcija — Najbrže do dobrih cijena</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div id="splash" class="splash" aria-label="BN akcija — Najbrže do dobrih cijena">
    <div class="splash-wave splash-wave-top"></div>
    <div class="splash-content">
      <div class="brand brand-large"><img class="brand-logo" src="./assets/logo-bn-akcija.svg" alt="BN akcija"></div>
      <p>Najbrže do<br>dobrih cijena</p>
    </div>
    <div class="splash-wave splash-wave-bottom"></div>
    <button id="skip-splash" class="skip-splash" type="button">Preskoči uvod</button>
  </div>
  <div class="app-shell">
    <header class="app-header">
      <button class="brand brand-button" id="brand-home" type="button" aria-label="BN akcija — početna"><img class="brand-logo" src="./assets/logo-bn-akcija.svg" alt=""></button>
      <button id="header-back" class="icon-button hidden" type="button" aria-label="Nazad"></button>
    </header>
    <main id="app-main" class="app-main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Glavna navigacija">
      <button class="nav-item active" id="nav-home" type="button" aria-current="page"></button>
      <button class="nav-item" id="nav-saved" type="button"></button>
      <button class="nav-item" id="nav-stores" type="button"></button>
    </nav>
  </div>
</body>
</html>
